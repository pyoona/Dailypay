<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกรายจ่าย</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#000;--mut:#000;--line:#dde2e8;--acc:#0f766e;--accbg:#d6f1ed;--onacc:#fff;--bar:#b9c4d0;--danger:#b42318;--acc2:#2563eb;--warm:#f59e0b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#18222e;--ink:#e8edf3;--mut:#93a1b2;--line:#2a3745;--acc:#4fd1c0;--accbg:#173a3a;--onacc:#06201d;--bar:#3a4a5b;--danger:#ff8a80;--acc2:#7aa7ff;--warm:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1720;--card:#18222e;--ink:#e8edf3;--mut:#93a1b2;--line:#2a3745;--acc:#4fd1c0;--accbg:#173a3a;--onacc:#06201d;--bar:#3a4a5b;--danger:#ff8a80;--acc2:#7aa7ff;--warm:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:4px 6px 12px}
button,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
h1{color:var(--ink);font-size:18px;margin:0 0 4px;font-weight:700}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 8px;margin-bottom:4px}
.row{display:grid;grid-template-columns:60px minmax(0,1fr) 82px;gap:4px}
.row input{padding:3px 6px;font-size:15px}
label{display:inline-block;font-size:12px;line-height:1.3;color:#fff;background:#1e3a8a;padding:0 8px;border-radius:99px;margin-bottom:1px}
.f{min-width:0}
.f.dt,.f.it{position:relative}
.sg{position:absolute;left:0;top:100%;z-index:20;margin-top:2px;min-width:100%;width:max-content;max-width:75vw;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.sg[hidden]{display:none}
.sg button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;min-height:40px;padding:6px 12px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.sg button:first-child{border-top:0}
.f.dt label{white-space:nowrap}
.cal{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#1e3a8a;color:#fff;box-shadow:0 2px 6px rgba(30,58,138,.35)}
.f.dt input{position:absolute;left:0;bottom:0;width:38px;height:38px;min-height:0;padding:0;opacity:0;border-radius:50%;cursor:pointer}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px 8px;min-height:34px;-webkit-appearance:none;appearance:none}
input[type=number]{-moz-appearance:textfield;font-size:14px!important;padding-left:4px!important;padding-right:4px!important}
input[list]::-webkit-calendar-picker-indicator{display:none!important}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main>section:first-of-type{padding-bottom:5px}
.act{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.act .err{margin:0}
.add{display:block;margin:0;font:inherit;font-size:15px;font-weight:600;width:auto;min-height:38px;min-width:140px;padding:2px 24px;white-space:nowrap;border:0;border-radius:10px;background:#9b1c1c;color:#fff;box-shadow:0 2px 8px rgba(155,28,28,.45);cursor:pointer}
.add:disabled{opacity:.6;cursor:default}
.err{color:var(--danger);font-size:13px;margin:2px 0 0;text-align:center}
.err:empty{display:none}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:var(--bg);padding:2px;border-radius:12px;border:1px solid var(--line)}
.tabs button{font:inherit;font-weight:500;min-height:32px;padding:2px 0;border:0;border-radius:8px;background:transparent;color:var(--mut);cursor:pointer}
.tabs button.on{background:#1e3a8a;color:#fff;font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;margin:3px 0 0}
.nav button{font:inherit;font-size:22px;width:36px;height:36px;border-radius:8px;border:1px solid var(--acc);background:var(--accbg);color:var(--ink);cursor:pointer}
.nav .lbl{font-weight:600;text-align:center;font-size:15px;padding:0 4px}
h2{color:var(--ink);font-size:14px;margin:0 0 2px;font-weight:600}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chart{display:flex;align-items:flex-end;gap:3px;height:62px}
.xl{margin-bottom:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col em{font-style:normal;font-size:11px;font-weight:600;line-height:14px;height:14px;white-space:nowrap;color:var(--ink)}
.col i{flex-shrink:0;display:block;width:100%;background:var(--acc2);opacity:.4;border-radius:4px 4px 0 0;min-height:2px}
.col.max i{background:var(--warm);opacity:1}
.xl{display:flex;gap:3px;font-size:12px;color:var(--mut);margin-top:1px}
.xl span{flex:1;text-align:center;min-width:0;overflow:hidden}
.g{border-top:1px solid var(--line)}
.g:first-child{border-top:0}
.dr{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:0;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.dr .n,.en .n{flex:1;min-width:0;overflow-wrap:anywhere}
.dr .v,.en .v{font-variant-numeric:tabular-nums}
.dh{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;font-weight:600;padding:4px 0 2px}
.lt{font-size:14px;font-weight:600;margin:0 0 2px}
.ds{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.ds small{font-size:12px;font-weight:400;color:var(--mut)}
.ds b{font-size:16px;font-variant-numeric:tabular-nums}
.g:first-child .dh{padding-top:0}
.ch{width:16px;text-align:center}
.en{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 3px 0 8px;background:var(--bg);border-radius:6px;margin-bottom:1px;font-size:15px}
.del{font:inherit;font-size:14px;min-height:26px;padding:0 8px;border-radius:6px;border:1px solid var(--danger);background:transparent;color:var(--danger);cursor:pointer}
.del.sure{background:var(--danger);color:var(--bg);font-weight:600}
.sum{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;padding:6px 10px;border-radius:10px;background:var(--accbg);color:var(--ink);font-size:15px}
.sum b{font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:4px 0;margin:0}
</style>
</head>
<body>
<main>
  <h1>บันทึกรายจ่าย</h1>

  <section>
    <div class="row">
      <div class="f dt"><label for="d" id="dlab">วันที่</label><div class="cal" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div><input id="d" type="date" aria-label="เลือกวันที่"></div>
      <div class="f it"><label for="it">รายการ</label><input id="it" placeholder="เลือกหรือพิมพ์" autocomplete="off"><div class="sg" id="sg" hidden></div></div>
      <div class="f"><label for="p">ราคา</label><input id="p" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
    </div>
    <div class="act"><button class="add" id="add">บันทึก</button><p class="err" id="err" role="alert"></p></div>
  </section>

  <section id="listBox"><h2 id="listT" hidden></h2><div id="list"></div><p class="err" id="err2" role="alert"></p></section>

  <section>
    <div class="tabs" id="tabs">
      <button data-m="month">เดือน</button><button data-m="year">ปี</button>
    </div>
    <div class="nav">
      <button id="prev" aria-label="ก่อนหน้า">‹</button>
      <div><div class="lbl" id="lbl"></div></div>
      <button id="next" aria-label="ถัดไป">›</button>
    </div>
    <div class="sum" id="sum"></div>
  </section>

  <section id="chartBox"><h2 id="chartT"></h2><div class="sc" id="sc"><div id="inn"></div></div></section>

</main>

<script>
const API="https://script.google.com/macros/s/AKfycbzlliiUCuC6JBJjHTeeVdKUwgO3EKqC8139f6NPqKobQdh6mdyVv-gQdr4c7MK3OB_zCA/exec";
// เรียก Apps Script web app (text/plain เพื่อเลี่ยง CORS preflight)
function call(action,args){
  // อยู่ในหน้า Apps Script -> ใช้ google.script.run ; อยู่บน GitHub -> ใช้ fetch
  if(window.google&&google.script&&google.script.run){
    return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[action](...(args||[])));
  }
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,args:args||[]})})
    .then(r=>r.json())
    .then(j=>{if(j.error)throw new Error(j.error);return j.data});
}
let ITEMS=[];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const money=n=>n.toLocaleString("th-TH",{minimumFractionDigits:0,maximumFractionDigits:2});
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayStr=()=>fmt(new Date());
let rows=[],mode="month",anchor=todayStr();


function items(){return[...new Set(ITEMS)]}
function showSg(){
  const l=items();
  $("sg").innerHTML=l.map(i=>`<button type="button" data-v="${esc(i)}">${esc(i)}</button>`).join("");
  $("sg").hidden=!l.length;
}
function drawItems(){if(document.activeElement===$("it"))showSg()}
$("it").addEventListener("focus",showSg);
$("it").addEventListener("click",showSg);
$("it").addEventListener("blur",()=>{$("sg").hidden=true});
$("sg").addEventListener("mousedown",e=>e.preventDefault());
$("sg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;$("it").value=b.dataset.v;$("sg").hidden=true;$("p").focus()});

let busy=false;
$("add").onclick=()=>{
  if(busy)return;
  const date=$("d").value,item=$("it").value.trim(),price=parseFloat($("p").value);
  if(!date||!item||!(price>0)){$("err").textContent="กรอกวันที่ รายการ และราคา (มากกว่า 0) ให้ครบ";return}
  $("err").textContent="";
  const done=()=>{busy=false;$("add").disabled=false;$("add").textContent="บันทึก"};
  busy=true;$("add").disabled=true;$("add").textContent="กำลัง…";
  call("addExpense",[date,item,price])
    .then(res=>{
      rows.push({row:res.row,date,item,price});anchor=date;done();
      $("it").value="";$("p").value="";drawItems();render();$("it").focus();
    })
    .catch(e=>{done();$("err").textContent="บันทึกไม่สำเร็จ: "+e.message});
};
["it","p"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")$("add").click()}));

$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){mode=b.dataset.m;render()}};
function shift(n){
  const d=parse(anchor);
  if(mode==="day")d.setDate(d.getDate()+n);
  else if(mode==="week")d.setDate(d.getDate()+7*n);
  else if(mode==="month"){d.setDate(1);d.setMonth(d.getMonth()+n)}
  else{d.setDate(1);d.setFullYear(d.getFullYear()+n)}
  anchor=fmt(d);render();
}
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);

function range(){
  const d=parse(anchor);
  if(mode==="day")return[d,d];
  if(mode==="week"){const s=new Date(d);s.setDate(d.getDate()-((d.getDay()+6)%7));const e=new Date(s);e.setDate(s.getDate()+6);return[s,e]}
  if(mode==="month")return[new Date(d.getFullYear(),d.getMonth(),1),new Date(d.getFullYear(),d.getMonth()+1,0)];
  return[new Date(d.getFullYear(),0,1),new Date(d.getFullYear(),11,31)];
}
const L=(d,o)=>d.toLocaleDateString("th-TH",o);

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m===mode));
  const[s,e]=range(),a=fmt(s),z=fmt(e);
  let label;
  if(mode==="day")label=L(s,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  else if(mode==="week")label=L(s,{day:"numeric",month:"short"})+" – "+L(e,{day:"numeric",month:"short",year:"numeric"});
  else if(mode==="month")label=L(s,{month:"long",year:"numeric"});
  else label="ปี "+L(s,{year:"numeric"});
  $("lbl").textContent=label;

  const inR=rows.filter(r=>r.date>=a&&r.date<=z);

  // summary: month = day 1 to today (or whole month if past), year = whole year
  {
    const t=todayStr();
    let lab,tot;
    if(mode==="year"){
      lab="รวมทั้งปี "+L(s,{year:"numeric"});
      tot=inR.reduce((n,r)=>n+r.price,0);
    }else{
      const end=(t>=a&&t<z)?t:z;
      tot=inR.filter(r=>r.date<=end).reduce((n,r)=>n+r.price,0);
      const de=parse(end);
      lab="รวมวันที่ 1 – "+de.getDate()+" "+L(de,{month:"short",year:"numeric"});
    }
    $("sum").innerHTML=`<span>${lab}</span><b>${money(tot)} บาท</b>`;
  }

  const days=Math.round((e-s)/864e5)+1;
  const byDay={};inR.forEach(r=>byDay[r.date]=(byDay[r.date]||0)+r.price);

  // chart
  $("chartBox").style.display=mode==="day"?"none":"";
  if(mode!=="day"){
    let vals=[],labs=[];
    if(mode==="year"){
      vals=Array(12).fill(0);inR.forEach(r=>vals[+r.date.slice(5,7)-1]+=r.price);
      labs=vals.map((_,i)=>L(new Date(2000,i,1),{month:"short"}));
      $("chartT").textContent="ยอดรายเดือน";
    }else{
      for(let i=0;i<days;i++){const d=new Date(s);d.setDate(s.getDate()+i);vals.push(byDay[fmt(d)]||0);
        labs.push(mode==="week"?L(d,{weekday:"short"}):String(i+1))}
      $("chartT").textContent="ยอดรายวัน";
    }
    const m=Math.max(...vals,1);
    const per=mode==="month"?Math.ceil(vals.length/2):vals.length;
    let html="";
    for(let st=0;st<vals.length;st+=per){
      let c="",x="";
      for(let k=st;k<st+per;k++){
        if(k<vals.length){const v=vals[k];
          c+=`<div class="col${v===m&&v>0?" max":""}" title="${money(v)} บาท">${v===m&&v>0?`<em>${money(v)}</em>`:""}<i style="height:calc((100% - 14px)*${v/m})"></i></div>`;
          x+=`<span>${labs[k]}</span>`;
        }else{c+='<div class="col"></div>';x+="<span></span>"}
      }
      html+=`<div class="chart">${c}</div><div class="xl">${x}</div>`;
    }
    $("inn").innerHTML=html;
  }


  // totals per day (per month in year view); tap a day to see its items
  const grp={};
  inR.forEach(r=>{const k=r.date;grp[k]=(grp[k]||0)+r.price});
  const td=todayStr(),todays=rows.filter(r=>r.date===td);
  grp[td]=todays.reduce((n,r)=>n+r.price,0);
  const ks=todays.length?[td]:[];
  $("listT").textContent="รายการ";
  $("list").innerHTML=ks.length?ks.map(k=>{
    const d=parse(k);
    const t=L(d,{weekday:"short",day:"numeric",month:"short",year:"numeric"});
    let h;
    h=`<div class="dh"><span>${t}</span><span class="ds"><small>ยอดรายวัน</small><b>${money(grp[k])}</b></span></div><div class="lt">รายการ</div>`+todays.map(r=>`<div class="en"><span class="n">${esc(r.item)}</span><span class="v">${money(r.price)}</span><button class="del${armed===r.row?" sure":""}" data-row="${r.row}" aria-label="ลบ ${esc(r.item)}">${armed===r.row?"ยืนยันลบ":"ลบ"}</button></div>`).join("");
    return `<div class="g">${h}</div>`;
  }).join(""):'<p class="empty">วันนี้ยังไม่มีรายจ่าย กรอกด้านบนเพื่อเริ่มบันทึก</p>';
}

let armed=null,armT=0;
$("list").onclick=e=>{
  const del=e.target.closest(".del");
  if(del){
    const row=+del.dataset.row,r=rows.find(x=>x.row===row);
    if(!r)return;
    $("err2").textContent="";
    if(armed!==row){armed=row;clearTimeout(armT);armT=setTimeout(()=>{armed=null;render()},3000);render();return}
    armed=null;clearTimeout(armT);
    del.disabled=true;del.textContent="กำลังลบ…";
    call("deleteExpense",[row,r.date,r.item,r.price])
      .then(()=>{rows=rows.filter(x=>x!==r);rows.forEach(x=>{if(x.row>row)x.row--});render()})
      .catch(er=>{$("err2").textContent="ลบไม่สำเร็จ: "+er.message;render()});
    return;
  }
  const dr=e.target.closest(".dr");
  if(!dr)return;
  mode="month";anchor=dr.dataset.k+"-01";render();
};

const showDate=()=>{const v=$("d").value;$("dlab").textContent=v?L(parse(v),{day:"numeric",month:"short"}):"วันที่"};
$("d").addEventListener("change",showDate);
$("d").addEventListener("click",()=>{try{$("d").showPicker()}catch(_){}});
$("d").value=todayStr();showDate();
render();
$("err").textContent="กำลังโหลดข้อมูล…";
call("getInitData")
  .then(r=>{rows=r.rows;ITEMS=r.items;$("err").textContent="";drawItems();render()})
  .catch(e=>{$("err").textContent="โหลดข้อมูลไม่สำเร็จ: "+e.message});
</script>
</body>
</html>
